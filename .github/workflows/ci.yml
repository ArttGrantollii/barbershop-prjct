name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vendos_salon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vendos_salon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vendos_salon
      REDIS_URL: redis://localhost:6379
      ALLOWED_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      NOTIFICATIONS_BACKEND: console
      REMINDERS_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Check migration drift
        working-directory: backend
        run: alembic check

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  frontend-e2e:
    name: Frontend E2E Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run customer booking smoke test
        working-directory: frontend
        run: npm run test:e2e

  compose:
    name: Compose Config
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: vendos
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_DB: vendos_salon
      DOMAIN: localhost
      TLS_EMAIL: ci@example.com
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key
      ALLOWED_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      VITE_API_URL: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI env file
        run: |
          cat > .env <<EOF
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          DOMAIN=${DOMAIN}
          TLS_EMAIL=${TLS_EMAIL}
          SECRET_KEY=${SECRET_KEY}
          ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
          FRONTEND_URL=${FRONTEND_URL}
          NOTIFICATIONS_BACKEND=console
          AWS_ACCESS_KEY_ID=
          AWS_SECRET_ACCESS_KEY=
          AWS_REGION=us-east-1
          AWS_SES_FROM_EMAIL=
          AWS_SNS_SENDER_ID=VendosSalon
          EOF

      - name: Validate development compose config
        run: docker compose config

      - name: Validate production compose config
        run: docker compose -f docker-compose.prod.yml config
